name: Package artifacts, tag and create github release

on: 
  push:
    branches:
      - 'release'
    tags-ignore:
      - '**'

env:
  CONTAINER_REGISTRY_URL: ghcr.io
  IMAGE_NAME: melkio/harmonia

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.configure.outputs.version }}
    steps:
    - id: configure
      name: Configure environment
      run: |
        VERSION=`date '+%Y.%m%d.%H%M'`
        echo "version=$VERSION" >> $GITHUB_OUTPUT

  package:
    runs-on: ubuntu-latest
    needs: setup
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.CONTAINER_REGISTRY_URL }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push core image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        tags: "${{ env.CONTAINER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
        push: true

  tag-and-release:
    runs-on: ubuntu-latest
    needs: setup
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Create tag and release
      run: gh release create ${{ env.VERSION }} --title ${{ env.VERSION }} --target ${{ github.REF_NAME }} 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}